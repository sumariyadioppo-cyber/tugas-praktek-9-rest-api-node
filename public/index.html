<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard Suhu Real-Time</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <h2>Monitoring Suhu Real-Time</h2>
  <div id="notif" style="color: red; font-weight: bold; margin-bottom: 12px;"></div>
  <canvas id="tempChart" width="600" height="250"></canvas>

  <script>
    const ctx = document.getElementById("tempChart").getContext("2d");
    const chart = new Chart(ctx, {
      type: "line",
      data: {
        labels: [],
        datasets: [{
          label: "Suhu (°C)",
          data: [],
          borderColor: "blue",
          tension: 0.2
        }]
      },
      options: {
        animation: false,
        scales: { y: { beginAtZero: false } }
      }
    });

    const protocol = location.protocol === "https:" ? "wss:" : "ws:";
    const ws = new WebSocket(`${protocol}//${location.host}`);

    ws.onmessage = (event) => {
      const payload = JSON.parse(event.data);
      const timeLabel = new Date(payload.timestamp).toLocaleTimeString();

      chart.data.labels.push(timeLabel);
      chart.data.datasets[0].data.push(payload.temperature);

      if (chart.data.labels.length > 20) {
        chart.data.labels.shift();
        chart.data.datasets[0].data.shift();
      }
      chart.update();

      const notifEl = document.getElementById("notif");
      notifEl.textContent = payload.notification || "";
    };
  </script>
</body>
</html>
